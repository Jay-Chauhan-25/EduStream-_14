<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduStream Interactive Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
        }
        .dark body {
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
        }
        .text-gradient-teal-purple {
            background-image: linear-gradient(to right, #2dd4bf, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <header class="bg-white dark:bg-gray-800 shadow-md">
        <nav class="container mx-auto p-4 flex justify-between items-center">
            <a href="#" class="text-3xl font-bold text-gradient-teal-purple">EduStream</a>
            <div class="flex items-center space-x-4">
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                    <i class="fas fa-moon text-teal-600 dark:text-purple-400"></i>
                </button>
                <button id="home-link" class="text-sm font-medium hover:text-teal-600 dark:hover:text-purple-400 transition-colors">Courses</button>
                <div id="auth-links" class="flex items-center space-x-4">
                    <button id="login-link" class="text-sm font-medium hover:text-teal-600 dark:hover:text-purple-400 transition-colors">Login</button>
                    <button id="register-link" class="px-4 py-2 text-sm font-medium bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-colors">Register</button>
                </div>
                <div id="user-links" class="hidden flex items-center space-x-4">
                    <button id="dashboard-link" class="text-sm font-medium hover:text-teal-600 dark:hover:text-purple-400 transition-colors">Dashboard</button>
                    <button id="logout-button" class="text-sm font-medium text-rose-500 dark:text-rose-400 hover:underline transition-colors">Logout</button>
                </div>
            </div>
        </nav>
    </header>

    <main id="main-content" class="container mx-auto p-4 py-12">
        </main>

    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-gray-900 bg-opacity-50 backdrop-blur-sm">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-sm">
            <h3 id="modal-title" class="text-xl font-semibold mb-4"></h3>
            <div id="modal-body">
                <p id="modal-message" class="text-gray-600 dark:text-gray-300 mb-6"></p>
            </div>
            <div class="flex justify-end space-x-2">
                <button id="modal-close" class="px-4 py-2 text-sm font-medium bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-colors">Close</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- GLOBAL STATE AND HELPERS ---
            const state = {
                users: [], // In-memory "database"
                courses: [
                    { id: 'c1', title: "Intro to React", type: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4", description: "Learn the fundamentals of modern web development with React.", price: 49.99 },
                    { id: 'c2', title: "Backend with Laravel", type: "audio", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", description: "Build scalable and secure APIs with the Laravel framework.", price: 79.99 },
                    { id: 'c3', title: "Databases with MongoDB", type: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4", description: "Master NoSQL database design and management.", price: 65.00 },
                    { id: 'c4', title: "UI/UX with Tailwind", type: "video", url: "https://www.w3schools.com/html/mov_bbb.mp4", description: "Design beautiful and responsive user interfaces with Tailwind CSS.", price: 39.99 }
                ],
                cart: [],
                currentUser: null,
            };

            const app = {
                mainContent: document.getElementById('main-content'),
                authLinks: document.getElementById('auth-links'),
                userLinks: document.getElementById('user-links'),
                themeToggle: document.getElementById('theme-toggle'),
                modalContainer: document.getElementById('modal-container'),
                modalTitle: document.getElementById('modal-title'),
                modalBody: document.getElementById('modal-body'),
                modalClose: document.getElementById('modal-close'),
            };

            // --- THEME TOGGLE (DARK MODE) ---
            const themeKey = 'edustream-theme';

            const updateTheme = (theme) => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    app.themeToggle.querySelector('i').classList.replace('fa-moon', 'fa-sun');
                } else {
                    document.documentElement.classList.remove('dark');
                    app.themeToggle.querySelector('i').classList.replace('fa-sun', 'fa-moon');
                }
                localStorage.setItem(themeKey, theme);
            };

            const initTheme = () => {
                const savedTheme = localStorage.getItem(themeKey) || 'light';
                updateTheme(savedTheme);
            };

            app.themeToggle.addEventListener('click', () => {
                const currentTheme = localStorage.getItem(themeKey) || 'light';
                updateTheme(currentTheme === 'light' ? 'dark' : 'light');
            });

            // --- NAVIGATION & ROUTING ---
            const showModal = (title, contentHTML) => {
                app.modalTitle.textContent = title;
                app.modalBody.innerHTML = contentHTML;
                app.modalContainer.classList.remove('hidden');
                app.modalContainer.classList.add('flex');
            };

            const hideModal = () => {
                // Stop any playing media
                const mediaElement = app.modalBody.querySelector('video, audio');
                if (mediaElement) {
                    mediaElement.pause();
                    mediaElement.currentTime = 0;
                }
                app.modalContainer.classList.add('hidden');
                app.modalContainer.classList.remove('flex');
            };

            app.modalClose.addEventListener('click', hideModal);

            const updateNav = () => {
                if (state.currentUser) {
                    app.authLinks.classList.add('hidden');
                    app.userLinks.classList.remove('hidden');
                } else {
                    app.authLinks.classList.remove('hidden');
                    app.userLinks.classList.add('hidden');
                }
            };

            const renderView = (view) => {
                let html = '';
                switch (view) {
                    case 'home':
                        html = renderHomeView();
                        break;
                    case 'register':
                        html = renderAuthForm(false);
                        break;
                    case 'login':
                        html = renderAuthForm(true);
                        break;
                    case 'dashboard':
                        html = renderDashboardView();
                        break;
                    default:
                        html = `
                            <div class="text-center p-12">
                                <h1 class="text-4xl font-bold mb-4">404 - Not Found</h1>
                                <p>The page you're looking for does not exist.</p>
                            </div>
                        `;
                }
                app.mainContent.innerHTML = html;
                if (view === 'home') addGalleryListeners();
                if (view === 'register' || view === 'login') addFormListeners(view);
            };

            // --- RENDER VIEWS ---
            const renderHomeView = () => {
                return `
                    <div class="max-w-7xl mx-auto">
                        <h1 class="text-4xl font-bold text-center mb-10 text-gradient-teal-purple">Browse Our Courses</h1>
                        <div class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                            ${state.courses.map(course => `
                                <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg overflow-hidden transform hover:scale-105 transition-transform duration-300">
                                    <button data-course-id="${course.id}" class="preview-btn relative w-full h-48 bg-gray-200 dark:bg-gray-700 flex flex-col items-center justify-center text-gray-400 p-4">
                                        <i class="fas ${course.type === 'video' ? 'fa-video' : 'fa-headphones'} text-6xl text-teal-500"></i>
                                        <p class="mt-4 text-sm font-medium">Click to Play ${course.type === 'video' ? 'Video' : 'Audio'}</p>
                                    </button>
                                    <div class="p-6">
                                        <h3 class="font-semibold text-lg mb-2">${course.title}</h3>
                                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">${course.description}</p>
                                        <div class="flex justify-between items-center">
                                            <span class="text-xl font-bold text-teal-600 dark:text-teal-400">$${course.price.toFixed(2)}</span>
                                            <button data-course-id="${course.id}" class="add-to-cart-btn px-4 py-2 text-sm font-medium bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-colors">
                                                Add to Cart
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            };

            const renderAuthForm = (isLogin) => {
                return `
                    <div class="max-w-md mx-auto bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg">
                        <h2 class="text-3xl font-bold mb-6 text-center text-gradient-teal-purple">${isLogin ? 'Login' : 'Create an Account'}</h2>
                        <form id="auth-form" novalidate>
                            <div class="mb-4">
                                <label for="email" class="block text-sm font-medium mb-1">Email</label>
                                <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 bg-gray-50 dark:bg-gray-700" required>
                                <p id="email-error" class="text-rose-500 text-xs mt-1 hidden">Please enter a valid email address.</p>
                            </div>
                            <div class="mb-6">
                                <label for="password" class="block text-sm font-medium mb-1">Password</label>
                                <input type="password" id="password" name="password" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500 bg-gray-50 dark:bg-gray-700" required minlength="6">
                                <p id="password-error" class="text-rose-500 text-xs mt-1 hidden">Password must be at least 6 characters long.</p>
                            </div>
                            <button type="submit" class="w-full p-3 font-semibold bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-colors">
                                ${isLogin ? 'Login' : 'Register'}
                            </button>
                        </form>
                    </div>
                `;
            };

            const renderDashboardView = () => {
                if (!state.currentUser) {
                    renderView('home');
                    return;
                }

                const renderCart = () => {
                    if (state.cart.length === 0) {
                        return '<p class="text-gray-500 dark:text-gray-400">Your cart is empty.</p>';
                    }
                    const total = state.cart.reduce((sum, item) => sum + item.price, 0);
                    return `
                        <ul class="space-y-4 mb-4">
                            ${state.cart.map(item => `
                                <li class="flex justify-between items-center p-4 bg-gray-50 dark:bg-gray-700 rounded-md">
                                    <span>${item.title}</span>
                                    <span>$${item.price.toFixed(2)}</span>
                                </li>
                            `).join('')}
                        </ul>
                        <div class="flex justify-between items-center font-bold text-lg mb-4">
                            <span>Total:</span>
                            <span>$${total.toFixed(2)}</span>
                        </div>
                        <button class="w-full px-4 py-3 bg-green-600 text-white rounded-md font-semibold hover:bg-green-700 transition-colors">
                            Proceed to Checkout
                        </button>
                    `;
                };

                return `
                    <div class="max-w-4xl mx-auto">
                        <h1 class="text-4xl font-bold mb-8 text-center">Hello, <span class="text-teal-600 dark:text-purple-400">${state.currentUser.email}</span>!</h1>
                        
                        <div class="grid md:grid-cols-2 gap-8">
                            <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg">
                                <h2 class="text-2xl font-semibold mb-4">Course Progress</h2>
                                <p class="text-gray-500 dark:text-gray-400">Your progress visualizations would go here.</p>
                                <div class="w-full h-48 bg-gray-200 dark:bg-gray-700 mt-4 rounded-md flex items-center justify-center">
                                    <span class="text-gray-400 dark:text-gray-500">Progress Chart Placeholder</span>
                                </div>
                            </div>

                            <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg">
                                <h2 class="text-2xl font-semibold mb-4">Your Shopping Cart</h2>
                                ${renderCart()}
                            </div>
                        </div>
                    </div>
                `;
            };

            // --- AUTHENTICATION LOGIC ---
            const authenticate = (email, password) => {
                const user = state.users.find(u => u.email === email && u.password === password);
                if (user) {
                    state.currentUser = user;
                    sessionStorage.setItem('loggedInUser', JSON.stringify(user));
                    showModal('Success', '<p class="text-gray-600 dark:text-gray-300 mb-6">You have been logged in successfully!</p>');
                    updateNav();
                    renderView('dashboard');
                } else {
                    showModal('Error', '<p class="text-gray-600 dark:text-gray-300 mb-6">Invalid email or password.</p>');
                }
            };

            const registerUser = (email, password) => {
                const existingUser = state.users.find(u => u.email === email);
                if (existingUser) {
                    showModal('Error', '<p class="text-gray-600 dark:text-gray-300 mb-6">An account with this email already exists.</p>');
                } else {
                    const newUser = { email, password };
                    state.users.push(newUser);
                    state.currentUser = newUser;
                    sessionStorage.setItem('loggedInUser', JSON.stringify(newUser));
                    showModal('Success', '<p class="text-gray-600 dark:text-gray-300 mb-6">Registration successful! You are now logged in.</p>');
                    updateNav();
                    renderView('dashboard');
                }
            };

            const logout = () => {
                state.currentUser = null;
                state.cart = []; // Clear cart on logout
                sessionStorage.removeItem('loggedInUser');
                updateNav();
                renderView('home');
                showModal('Logged Out', '<p class="text-gray-600 dark:text-gray-300 mb-6">You have been logged out successfully.</p>');
            };

            // --- EVENT LISTENERS ---
            const addGalleryListeners = () => {
                document.querySelectorAll('.add-to-cart-btn').forEach(button => {
                    button.addEventListener('click', (e) => {
                        if (!state.currentUser) {
                            showModal('Login Required', '<p class="text-gray-600 dark:text-gray-300 mb-6">Please log in to add courses to your cart.</p>');
                            return;
                        }
                        const courseId = e.target.dataset.courseId;
                        const courseToAdd = state.courses.find(c => c.id === courseId);
                        if (courseToAdd && !state.cart.find(c => c.id === courseId)) {
                            state.cart.push(courseToAdd);
                            showModal('Added to Cart', <p class="text-gray-600 dark:text-gray-300 mb-6">${courseToAdd.title} has been added to your cart.</p>);
                        }
                    });
                });

                document.querySelectorAll('.preview-btn').forEach(button => {
                    button.addEventListener('click', (e) => {
                        const courseId = e.currentTarget.dataset.courseId;
                        const courseToPreview = state.courses.find(c => c.id === courseId);
                        if (courseToPreview) {
                            const mediaHTML = courseToPreview.type === 'video'
                                ? <video class="w-full rounded-md" controls autoplay><source src="${courseToPreview.url}" type="video/mp4">Your browser does not support the video tag.</video>
                                : <audio class="w-full" controls autoplay><source src="${courseToPreview.url}" type="audio/mp3">Your browser does not support the audio tag.</audio>;
                            showModal(Preview: ${courseToPreview.title}, mediaHTML);
                        }
                    });
                });
            };

            const addFormListeners = (view) => {
                const form = document.getElementById('auth-form');
                if (!form) return;

                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = form.querySelector('#email').value;
                    const password = form.querySelector('#password').value;

                    // HTML5 Validation API check
                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return;
                    }

                    if (view === 'login') {
                        authenticate(email, password);
                    } else {
                        registerUser(email, password);
                    }
                });
            };

            // --- INITIALIZATION ---
            initTheme();
            const storedUser = sessionStorage.getItem('loggedInUser');
            if (storedUser) {
                state.currentUser = JSON.parse(storedUser);
                updateNav();
                renderView('dashboard');
            } else {
                renderView('home');
            }

            // --- BIND NAVIGATION BUTTONS ---
            document.getElementById('home-link').addEventListener('click', () => renderView('home'));
            document.getElementById('login-link').addEventListener('click', () => renderView('login'));
            document.getElementById('register-link').addEventListener('click', () => renderView('register'));
            document.getElementById('dashboard-link').addEventListener('click', () => renderView('dashboard'));
            document.getElementById('logout-button').addEventListener('click', logout);
        });
    </script>
</body>
</html>
